[project]
name = "sportstaettenatlas"
version = "0.1.0"
description = "Leitet aus offenen ALKIS-Daten eine erste Tabelle von Sportstätten-Kandidaten ab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "openpyxl>=3.1",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "requests>=2.31",
    "shapely>=2.0",
    "tqdm>=4.66",
]

[project.scripts]
sportstaettenatlas = "sportstaettenatlas.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
