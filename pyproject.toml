[project]
name = "sportstaettenatlas"
version = "0.1.0"
description = "Offener Sportstättenatlas: Datenbestand im Git, statische Webseite und Analysen (ALKIS-Abgleich)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "pydantic>=2.6",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "requests>=2.31",
    "shapely>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Diagramm des Datenmodells (daten/datenmodell.svg); braucht Graphviz:
# sudo apt install graphviz graphviz-dev && uv sync --extra doku
doku = ["erdantic>=1.0"]

[project.scripts]
sportstaettenatlas = "sportstaettenatlas.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",  # Typprüfung (uv run mypy; Einstellungen unten)
    "playwright>=1.40",  # Browser-Tests (tests/test_web.py); danach: playwright install chromium
    "pre-commit>=3.7",  # Prüfungen vor jedem Commit (.pre-commit-config.yaml)
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# zu den Standardregeln (Syntax, unbenutzte Namen …): typische Fehler (B), neuere
# Schreibweisen (UP), Vereinfachungen (SIM), sortierte Importe (I)
extend-select = ["B", "UP", "SIM", "I"]
# „Yoda“ meldet auch Vergleiche mit Konstanten links, z. B. PFLICHT <= set(kopf) (Teilmenge)
ignore = ["SIM300"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# uv run mypy – prüft src/; erst nachsichtig (Funktionen ohne Typangaben bleiben ungeprüft)
python_version = "3.12"
files = ["src"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# ohne Typangaben (oder nur mit Zusatzpaketen): als Any behandeln, überall gleich
module = [
    "erdantic.*",
    "geopandas.*",
    "pandas.*",
    "playwright.*",
    "pyogrio.*",
    "pyproj.*",
    "requests.*",
    "shapely.*",
    "tqdm.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Die Auswahllisten (Enum aus den Werten in anlagen.py u. a.) entstehen zur Laufzeit;
# als Typ der Felder sind sie für mypy unbekannt
module = "sportstaettenatlas.modell.klassen"
disable_error_code = ["valid-type"]
