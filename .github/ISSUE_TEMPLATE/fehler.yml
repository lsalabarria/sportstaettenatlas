# Vorlage für den Knopf „Bug melden“ der Webseite (konfig.js: fehler_url).
# Die Webseite füllt die Felder „seite“ und „browser“ über URL-Parameter vor.
name: Bug melden
description: Etwas auf der Karte oder in den Daten funktioniert nicht wie erwartet.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung! **Tickets sind öffentlich** – bitte keine E-Mail-Adressen,
        Telefonnummern oder andere persönliche Daten eintragen.
        Falsche oder fehlende Sportstätten bitte über „Sportstätte vorschlagen“ melden.
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
      description: Was haben Sie gemacht, und was ist dann passiert?
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Was hätten Sie erwartet?
  - type: input
    id: seite
    attributes:
      label: Adresse der Seite
      description: Wird beim Klick auf „Bug melden“ eingetragen (mit Ansicht und Gebiet).
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Wird automatisch eingetragen.
